input {
    kafka {
        bootstrap_servers => "kafka:9092"
        topics => ["elk-jenkins-lab-logs"]
        group_id => "logstash-elk-jenkins-lab"
        auto_offset_reset => "earliest"
        codec => json
    }
}

filter {
    mutate {
        add_field => {
            "[@metadata][index_name]" => "demo-app-elk-jenkins-%{+YYYY.MM.dd}"
        }
    }
}

output {
    stdout {
        codec => rubydebug
    }

    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "demo-app-elk-jenkins-%{+YYYY.MM.dd}"
    }
}